name: CI

on:
  push:
    branches: [main]
  pull_request:

# Uma execução por branch: um push novo cancela a anterior, que já não interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verificar:
    name: Tipos e formato
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck de todos os pacotes
        run: pnpm -r typecheck

  testar:
    name: Suíte completa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pokeidle
          POSTGRES_PASSWORD: pokeidle
          POSTGRES_DB: pokeidle_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U pokeidle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://pokeidle:pokeidle@localhost:5433/pokeidle_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Testes de todos os pacotes
        run: pnpm -r test

  smoke:
    name: Smoke no navegador
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pokeidle
          POSTGRES_PASSWORD: pokeidle
          POSTGRES_DB: pokeidle_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U pokeidle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://pokeidle:pokeidle@localhost:5433/pokeidle_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar Chromium do Playwright
        run: pnpm --filter @pokeidle/client exec playwright install --with-deps chromium
      - name: Smoke
        run: pnpm client:e2e
      - name: Guardar vídeo e rastro quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/client/playwright-report
            packages/client/test-results
          retention-days: 7

  imagem:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compilar a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pokeidle:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Subir a imagem com Postgres e testar /health
        run: |
          set -euo pipefail
          docker network create pokeidle-ci
          trap 'docker logs pokeidle-ci 2>/dev/null || true; docker rm -f pokeidle-ci pokeidle-ci-db 2>/dev/null || true; docker network rm pokeidle-ci 2>/dev/null || true' EXIT

          docker run -d --name pokeidle-ci-db --network pokeidle-ci \
            -e POSTGRES_USER=pokeidle -e POSTGRES_PASSWORD=pokeidle \
            -e POSTGRES_DB=pokeidle postgres:16
          banco_pronto=0
          for i in $(seq 1 30); do
            if docker exec pokeidle-ci-db pg_isready -U pokeidle -d pokeidle; then banco_pronto=1; break; fi
            sleep 1
          done
          test "$banco_pronto" -eq 1

          docker run -d --name pokeidle-ci --network pokeidle-ci -p 127.0.0.1:3000:3000 \
            -e DATABASE_URL=postgres://pokeidle:pokeidle@pokeidle-ci-db:5432/pokeidle \
            -e APP_ORIGIN=http://localhost:3000 -e COOKIE_SECURE=false \
            pokeidle:ci
          saudavel=0
          for i in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/health | grep -q '"status":"ok"'; then saudavel=1; break; fi
            sleep 2
          done
          test "$saudavel" -eq 1
